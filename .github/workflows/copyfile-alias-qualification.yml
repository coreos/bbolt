name: Source-file alias copy regression qualification
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout exact candidate with no persisted token
        uses: actions/checkout@v4
        with:
          ref: fix-copyfile-source-alias-20261025
          fetch-depth: 0
          persist-credentials: false
      - name: Install supported Go toolchain
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Check gofmt
        shell: bash
        run: |
          test -z "$(gofmt -l tx.go tx_copyfile_alias_test.go)"
      - name: Run source-inode regression matrix
        run: go test -count=1 -run 'TestTx_CopyFileRejectsSourceAliases|TestTx_CopyFileOverwritesUnrelatedDestination|TestTx_CopyFile$' .
      - name: Run race-check on affected copy behavior
        run: go test -race -count=1 -run 'TestTx_CopyFileRejectsSourceAliases|TestTx_CopyFileOverwritesUnrelatedDestination|TestTx_CopyFile$' .
      - name: Validate source structure without modifying production
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          source=Path('tx.go').read_text()
          copyfile=source.split('func (tx *Tx) CopyFile(',1)[1].split('func (tx *Tx) allocate(',1)[0]
          assert copyfile.index('sameFile(tx.db.file, f)') < copyfile.index('f.Truncate(0)')
          assert 'os.O_TRUNC' not in copyfile.split('tx.db.openFile',1)[1].split('\n',1)[0]
          print('PASS: file identity checked before destructive truncate')
          PY
